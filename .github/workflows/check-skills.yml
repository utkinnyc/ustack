name: check-skills

# Structural checks for every plugin: frontmatter, skill references, description length,
# rules size, hook JSON, and script syntax (see .github/scripts/check_skills.py).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_skills.py
