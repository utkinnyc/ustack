schema_version: "1.1"
name: gather-messy-logs
description: Real-world style logs (blank lines, "each side", "so 90 x 6", seconds, typos, notes) and Strava (default titles, descriptions, a day with no log, a log with no Strava) come back complete and honest.
tags: [gather, messy]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: Show me all my workouts from the last 30 days.
graders:
  - name: shoulder-press-so-line
    type: regex
    pattern: '90\s*[x×]\s*6[\s\S]*90\s*[x×]\s*5[\s\S]*80\s*[x×]\s*8'
  - name: dead-hang-seconds
    type: regex
    pattern: '35\s*(s\b|sec)[\s\S]*30\s*(s\b|sec)[\s\S]*27\s*(s\b|sec)'
    flags: i
  - name: nov4-log-without-strava
    type: regex
    pattern: '2026-11-04'
  - name: strength-without-sets-oct29
    type: regex
    # Oct 29 is in Strava with no log: the user must be told it has no sets, in any wording
    pattern: '(2026-10-29|Oct(ober)?\.? 29)[^\n]*no (sets|exercises)|no (sets|exercises)[^\n]*(2026-10-29|Oct(ober)?\.? 29)|without sets[^\n]*(2026-10-29|Oct(ober)?\.? 29)'
    flags: i
  - name: strava-description-verbatim
    type: regex
    pattern: 'legs are cooked'
  - name: nov12-merged
    type: regex
    pattern: '2026-11-12[\s\S]*?\[\s*logs\s*,\s*strava\s*\]'
    flags: i
  - name: ignored-month-file
    type: regex
    # the user must be told, in any wording: "ignored files: November 2026.md" or "November 2026.md was skipped"
    pattern: 'November 2026[^\n]*(skip|ignor|not (read|used))|(skip|ignor|not (read|used))[^\n]*November 2026'
    flags: i
  - name: no-ai-summary
    type: regex
    pattern: '9,870|188 bpm|Top PR'
    match: not_contains
  - name: judge-notes-and-honesty
    type: llm
    criteria: |
      The logs include these notes, which must be kept close to verbatim on their days:
      Nov 2 "knees caving in a bit on the last set", Nov 11 "Kept the knees out this time",
      Nov 12 the gym/food line and "Finished all in around 55 mins", Oct 28 "lower back felt
      a little tight after squats".
      Strava supplies, per activity: start time, duration, distance, pace, max pace, average
      and max heart rate, elevation and relative effort (e.g. Oct 31 run: 6.81 km, 6:17/km,
      avg HR 151.6, max HR 169). Showing those values is correct, and so is writing a
      duration in h:mm:ss.
      PASS if those notes appear on the right days, every logged set is listed, and the
      reply adds no numbers of its own: no totals, counts per sport, averages or trends,
      unless marked "(calc)".
      FAIL if notes are dropped or paraphrased beyond recognition, sets are missing, or it
      adds unmarked totals, counts or other numbers that are in neither the logs nor Strava.
